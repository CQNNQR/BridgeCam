services:
  - type: web
    name: bridgecam
    runtime: node
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && node src/index.js
    buildFilter:
      paths:
        - server/**
        - mobile/**
        - shared/**
    envVars:
      - key: NODE_ENV
        value: production
    plan: free
    healthCheckPath: /health
