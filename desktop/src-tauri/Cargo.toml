[package]
name = "desktop"
version = "1.0.0+1"
description = "BridgeCam — Wireless HD PC Webcam & Microphone"
authors = ["BridgeCam Contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[package.metadata]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# Official Tauri updater plugin (verifies minisign signatures)
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Shared memory utilities for virtual driver pipeline
memmap2 = "0.5"
uuid = { version = "1", features = ["v4"] }
once_cell = "1"
base64 = "0.21"
# Localhost WebSocket server for frame delivery — bypasses Tauri IPC
# (WebView2 IPC adds ~130ms of overhead per 8.3MB frame)
tungstenite = "0.24"
# Virtual mic pipe: write PCM to VB-Audio Cable Input (WASAPI, Sprint 7)
cpal = "0.15"

# --------------------------------------------------------------------------
# Dev profile: opt-level 1 enables SIMD memcpy/memset instead of the default
# debug-mode byte-by-byte loop.  Critical because we copy 8.3MB (1080p RGBA)
# to the mmap SHM every frame — unoptimised debug: ~80ms, opt-level 1: <1ms.
# Compile time increase is minimal (~10-15%) vs opt-level 0.
# --------------------------------------------------------------------------
[profile.dev]
opt-level = 1

# Named Win32 shared memory & Winsock2 (DirectShow / MF driver pipeline)
[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["memoryapi", "winnt", "handleapi", "winerror", "minwindef", "winsock2"] }
# Windows Media Foundation + COM interfaces for IMFVirtualCamera activation
windows = { version = "0.58", features = ["Win32_Media_MediaFoundation", "Win32_System_Com"] }

