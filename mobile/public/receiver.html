<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>BridgeCam — Receiver</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles/main.css">
    <style>
      html, body { min-height: 100%; align-items: flex-start; }
      .recv-container {
        width: 100%;
        max-width: 780px;
        margin: 0 auto;
        padding: 1.5rem 1.25rem 2.5rem;
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
      }
      .recv-header {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding-bottom: 0.75rem;
        border-bottom: 1px solid var(--border);
      }
      .recv-title {
        font-size: 1rem;
        font-weight: 700;
        color: var(--accent);
        letter-spacing: 0.04em;
        text-shadow: 0 0 16px rgba(0,229,184,0.3);
      }
      .recv-sub { font-size: 0.78rem; color: var(--text-muted); margin-left: auto; }

      /* Video section */
      .recv-video-wrap {
        position: relative;
        background: #000;
        border-radius: var(--radius-lg);
        overflow: hidden;
        aspect-ratio: 16 / 9;
        border: 1px solid var(--border);
        box-shadow: var(--shadow-md);
      }
      .recv-video-wrap video {
        width: 100%; height: 100%;
        object-fit: contain;
        background: #000;
        display: block;
      }
      .recv-overlay {
        position: absolute;
        top: 0.6rem;
        left: 0.6rem;
        display: flex;
        gap: 0.35rem;
        flex-wrap: wrap;
        pointer-events: none;
      }
      .recv-diag {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 0.5rem 0.75rem;
        background: rgba(0,0,0,0.7);
        font-size: 0.75rem;
        font-family: var(--font-mono);
        color: var(--warning);
        backdrop-filter: blur(4px);
      }

      /* Join panel */
      .join-panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        padding: 1.1rem;
        display: flex;
        gap: 0.75rem;
        align-items: flex-end;
      }
      .join-panel .field { flex: 1; }
      .join-panel .field label-text {
        font-size: 0.72rem;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        color: var(--text-muted);
        display: block;
        margin-bottom: 0.3rem;
      }
      .join-panel button {
        flex: none;
        padding: 0.62rem 1.25rem;
        font-size: 0.88rem;
        font-weight: 700;
        background: var(--accent);
        color: var(--bg);
        border: none;
        border-radius: var(--radius-md);
        cursor: pointer;
        transition: all var(--transition-fast);
        font-family: var(--font-sans);
        white-space: nowrap;
        letter-spacing: 0.03em;
      }
      .join-panel button:hover { background: var(--accent-hover); box-shadow: var(--accent-glow); transform: translateY(-1px); }
      .join-panel button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

      .recv-footer { text-align: center; font-size: 0.75rem; color: var(--text-muted); }
      .recv-footer code { font-family: var(--font-mono); color: var(--accent); font-size: 0.8rem; }
    </style>
  </head>
  <body>
    <div class="recv-container">

      <!-- Header -->
      <header class="recv-header">
        <span class="recv-title">BridgeCam</span>
        <span class="logo-badge" style="font-size:0.65rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);background:var(--surface-hover);border:1px solid var(--border);padding:0.12rem 0.5rem;border-radius:9999px;">Receiver</span>
        <span class="recv-sub">WebRTC live feed</span>
      </header>

      <!-- Video -->
      <div class="recv-video-wrap">
        <video id="remote" autoplay playsinline muted></video>
        <div class="recv-overlay">
          <div id="status" class="badge pulsing">Idle</div>
          <div id="latency" class="badge small" hidden>-- ms</div>
          <div id="stats" class="badge small" hidden>fps: -- | dropped: --</div>
        </div>
        <div id="senderDiagnostic" class="recv-diag" hidden></div>
      </div>

      <!-- Join panel -->
      <div class="join-panel">
        <div class="field">
          <span style="font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--text-muted);display:block;margin-bottom:0.3rem;">Room ID</span>
          <input id="roomInput" type="text" placeholder="Enter room ID or use ?room= param" />
        </div>
        <button id="joinBtn">Join Room</button>
      </div>

      <div id="error" class="error" role="alert" hidden></div>

      <footer class="recv-footer">
        Create a room at <code>/host</code> and scan the QR code with your phone.
      </footer>
    </div>

    <script type="module" src="/src/receiver.js"></script>
  </body>
</html>
